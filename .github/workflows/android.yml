name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:   # ручной запуск кнопкой "Run workflow"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 4.1.0 + Gradle 6.5 работают с JDK 8/11 (на 17+ не соберётся)
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: gradle

      # Ставит Android SDK и принимает лицензии
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-29" "build-tools;29.0.3"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleNormalDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleNormalRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenHub-debug
          path: app/build/outputs/apk/normal/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenHub-release
          path: app/build/outputs/apk/normal/release/*.apk
          
