name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:   # ручной запуск кнопкой "Run workflow"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # sdkmanager нового поколения требует JDK 17 - используем её только для установки SDK
      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''   # пакет 'tools' по умолчанию больше не существует, ставим нужное сами ниже

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-29" "build-tools;29.0.3"

      # Сам проект (AGP 4.1.0, Gradle 6.5, Dagger 2.11) собирается на JDK 8:
      # в JDK 9+ нет javax.annotation.Generated, который нужен Dagger
      - name: Set up JDK 8 (for build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleNormalDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleNormalRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenHub-debug
          path: app/build/outputs/apk/normal/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenHub-release
          path: app/build/outputs/apk/normal/release/*.apk
